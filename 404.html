<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>404 — Capital As A Force</title>
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="icon" href="img/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #06111f;
      --bg2:    #081629;
      --gold:   #c8962a;
      --gold-bright: #f0c040;
      --white:  #e8f0f8;
      --muted:  #7a8fa6;
      --line:   rgba(200, 150, 42, 0.18);
      --serif:  'Cormorant Garamond', Georgia, serif;
      --sans:   'DM Sans', system-ui, sans-serif;
      --cond:   'Barlow Condensed', sans-serif;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: var(--sans);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 0 40px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(6, 17, 31, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .nav-logo img {
      height: 36px;
      width: auto;
      display: block;
    }

    .nav-home {
      font-family: var(--cond);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-home:hover { color: var(--gold); }

    /* ── Main content ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 68px 40px 0;
      min-height: 100vh;
    }

    .content {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 80px 0 60px;
    }

    .eyebrow {
      font-family: var(--cond);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .numeral {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(7rem, 18vw, 13rem);
      font-weight: 400;
      line-height: 0.85;
      color: var(--gold);
      letter-spacing: -0.02em;
      margin-bottom: 32px;
      display: block;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: var(--gold);
      margin-bottom: 28px;
      opacity: 0.6;
    }

    h1 {
      font-family: var(--serif);
      font-size: clamp(1.5rem, 3.5vw, 2.1rem);
      font-weight: 600;
      line-height: 1.2;
      color: var(--white);
      text-wrap: balance;
      margin-bottom: 16px;
    }

    p {
      font-size: 1rem;
      line-height: 1.7;
      color: var(--muted);
      max-width: 480px;
      margin-bottom: 40px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--cond);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      background: linear-gradient(135deg, var(--gold-bright), var(--gold));
      color: var(--bg);
      padding: 14px 30px;
      border-radius: 2px;
      transition: filter 0.25s, transform 0.25s;
    }
    .cta:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }
    .cta:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .cta-arrow {
      transition: transform 0.2s;
    }
    .cta:hover .cta-arrow {
      transform: translateX(3px);
    }

    /* ── Footer line ── */
    footer {
      padding: 20px 40px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-copy {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .footer-links {
      display: flex;
      gap: 24px;
    }

    .footer-links a {
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--gold); }

    @media (max-width: 600px) {
      nav { padding: 0 20px; }
      main { padding: 68px 20px 0; }
      .content { padding: 60px 0 40px; }
      footer { padding: 20px; }
      .footer-links { display: none; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .numeral {
        animation: fadeUp 0.7s ease both;
      }
      .divider {
        animation: fadeUp 0.7s 0.1s ease both;
      }
      h1 {
        animation: fadeUp 0.7s 0.18s ease both;
      }
      p {
        animation: fadeUp 0.7s 0.26s ease both;
      }
      .cta {
        animation: fadeUp 0.7s 0.34s ease both;
      }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo" aria-label="Capital As A Force — Home">
      <img src="img/CAAF-removebg-preview.webp" alt="Capital As A Force" />
    </a>
    <a href="/" class="nav-home">Back to Home</a>
  </nav>

  <main>
    <div class="content">
      <span class="eyebrow">Error</span>
      <span class="numeral" aria-hidden="true">404</span>
      <div class="divider"></div>
      <h1>This page doesn't exist.</h1>
      <p>The link may be outdated or the address has changed. Return to the homepage to continue exploring our work.</p>
      <a href="/" class="cta">
        Return Home
        <svg class="cta-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </div>
  </main>

  <footer>
    <span class="footer-copy">&copy; 2026 Capital As A Force. All rights reserved.</span>
    <nav class="footer-links" aria-label="Footer">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/events">Events</a>
      <a href="/#contact">Contact</a>
    </nav>
  </footer>

</body>
</html>
